# chen_vue 容器内 nginx 配置 —— 只做静态托管
# 注意: /api/ 与 /sock/ 不在这里处理, 由宿主机外层 nginx 反代到 central-server

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # 容器健康检查
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 入口 HTML 绝不缓存: 它引用的 asset 文件名会随每次构建变化
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }

    # Vue Router history 模式: 未命中的路径一律回落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源
    # 不放 immutable: /static/css/app.app.css 这种入口文件名不带 hash,
    # 长缓存会导致改版后浏览器仍用旧样式. 30 天 + ETag 更稳.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # monaco-editor 的 worker 文件在根目录, 文件名不带 hash
    location ~* ^/[^/]+\.worker\.js$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
}
